# Shareable static preview on GitHub Pages.
# The REAL production deployment is Vercel (see README.md) — this preview is
# noindexed, has no enquiry API (the form falls back to email), and bakes in
# availability at build time (the daily cron keeps it fresh).
name: Deploy preview to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # refresh the baked-in availability calendar daily at 04:00 UTC
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # API routes are not supported by static export; the preview form uses mailto
      - run: rm -rf src/app/api
      - run: npm run build
        env:
          STATIC_EXPORT: "1"
      - run: touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
